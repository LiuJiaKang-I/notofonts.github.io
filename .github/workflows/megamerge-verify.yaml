name: Verify megamerge fixes

# Manual-only verification. Unlike megamerge.yaml this never commits anything
# back to the repo, and it checks out the triggering ref (the fix branch)
# rather than a hardcoded main.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # megamerge.yaml has no timeout, which is why the livelock burned 6h a
    # month. Fail fast here instead.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harfbuzz
        uses: notofonts/install-harfbuzz-action@main

      - name: Install dependencies
        run: pip install fontTools gftools uharfbuzz

      - name: Show dependency versions
        run: pip list | grep -Ei "fonttools|gftools|uharfbuzz"

      - name: Confirm the upem anomaly still exists in the tree
        run: |
          python3 - <<'PY'
          from fontTools.ttLib import TTFont
          todhri = TTFont('fonts/NotoSerifTodhri/hinted/ttf/NotoSerifTodhri-Regular.ttf')['head'].unitsPerEm
          serif = TTFont('fonts/NotoSerif/googlefonts/ttf/NotoSerif-Regular.ttf')['head'].unitsPerEm
          print(f"NotoSerifTodhri upem = {todhri}")
          print(f"NotoSerif       upem = {serif}")
          assert todhri == 1024 and serif == 1000, "input assumption changed"
          print("OK: inputs still mismatched, fix is still relevant")
          PY

      - name: Verify both megamerge fixes
        env:
          # Keep the harfbuzz budget well under the job timeout so a livelock
          # falls back instead of burning the whole run.
          MEGAMERGE_HB_BUDGET: "300"
        run: cd megamerge && python3 -u verify_upem_fix.py
